name: Daily Meta App Install Report

on:
  schedule:
    - cron: "5 8 * * *"
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: daily-meta-report
  cancel-in-progress: true

defaults:
  run:
    working-directory: meta-monitor

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily Slack report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          META_AD_ACCOUNT_ID: act_972808873202575
          META_CAMPAIGN_OBJECTIVE: OUTCOME_APP_PROMOTION
        run: python src/monitor.py
